<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>배차 안내 · 조일그룹</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --bg: #F3EEE5; --panel: #FFFFFF; --ink: #1E1C19; --muted: #7A7265; --line: #E2D9C9; --orange: #F07A22; --green: #2C7040; --red: #C2412B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
    .bar { height: 5px; background: linear-gradient(90deg, #E0472E 0 20%, #F07A22 20% 40%, #F4BE2E 40% 60%, #4FA864 60% 80%, #2A9DB0 80%); }
    h1 { font-size: 22px; margin: 6px 0 2px; }
    .sub { color: var(--muted); font-size: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
    .card.from { background: #FFF8EE; }
    .no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; margin-right: 8px; flex: none; }
    .ttl { display: flex; align-items: center; font-size: 19px; font-weight: 800; }
    .row { margin-top: 6px; font-size: 15px; }
    .muted { color: var(--muted); }
    .items { margin-top: 6px; background: #F7F3EC; border-radius: 10px; padding: 8px 10px; font-size: 15px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; padding: 0 10px; }
    .btn.main { background: var(--ink); color: #fff; border-color: var(--ink); grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
    .btn.done { background: #E7F3EA; color: var(--green); border-color: #BFDDC6; }
    .tel { display: inline-block; margin: 4px 8px 0 0; padding: 6px 10px; border-radius: 10px; background: #F1ECE3; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; }
    .err { color: var(--red); font-weight: 700; }
    .ok { color: var(--green); font-weight: 700; }
    .note { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }
    .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: var(--ink); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -3px; }
    @keyframes s { to { transform: rotate(360deg); } }
    input[type=file] { display: none; }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap" id="app"><p class="muted"><span class="spin"></span> 불러오는 중…</p></div>
  <script src="config.js"></script>
  <script>if (!(window.JOIL_CONFIG && window.JOIL_CONFIG.API_URL)) document.write('<script src="apps-script/Calc.js"><\/script><script src="assets/demo.js"><\/script>');</script>
  <script>
  (function () {
    'use strict';
    var API_URL = (window.JOIL_CONFIG && window.JOIL_CONFIG.API_URL) || '';
    var T = String(location.hash || '').replace(/^#\/?/, '');
    var app = document.getElementById('app'), data = null, busy = {};
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function won(n) { return Number(n || 0).toLocaleString('ko-KR'); }
    function api(action, payload) {
      var req = Object.assign({ action: action, t: T }, payload || {});
      if (!API_URL) return window.JoilDemo.call(req);
      return fetch(API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now(), { method: 'POST', body: JSON.stringify(req), cache: 'no-store', credentials: 'omit', redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('서버 연결 오류 (' + r.status + ')'); return r.json(); })
        .then(function (j) { if (!j.ok) throw new Error(j.error || '오류가 났어요.'); return j; });
    }
    function tels(list) { return (list || []).map(function (t) { var num = String(t).replace(/[^0-9]/g, ''); return num.length >= 8 ? '<a class="tel" href="tel:' + num + '">📞 ' + esc(t) + '</a>' : '<span class="tel">' + esc(t) + '</span>'; }).join(''); }
    function navLinks(name, addr, lat, lng) {
      var k = lat ? 'https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng : 'https://map.kakao.com/link/search/' + encodeURIComponent(addr || name);
      var t = lat ? 'tmap://route?goalname=' + encodeURIComponent(name) + '&goalx=' + lng + '&goaly=' + lat : 'tmap://search?name=' + encodeURIComponent(addr || name);
      return '<a class="btn" href="' + k + '" target="_blank" rel="noopener">🗺 카카오맵</a><a class="btn" href="' + t + '">🚗 티맵</a>';
    }
    function draw() {
      var d = data, tb = 0, tk = 0;
      d.stops.forEach(function (s) { tb += s.bundle; tk += s.kg; });
      var got = function (fc) { return d.receipts.filter(function (r) { return r.fc === fc; }); };
      var nGot = d.stops.filter(function (s) { return got(s.fc).length; }).length;
      var p = d.place;
      app.innerHTML = '<div class="sub">' + esc(d.date) + ' · ' + esc(d.cust) + '</div><h1>' + d.no + '호차 · 착지 ' + d.stops.length + '곳</h1>' +
        '<div class="sub">총 ' + won(tb) + '번들 / ' + won(tk) + 'kg' + (d.car || d.driver ? ' · ' + esc([d.car, d.driver].filter(Boolean).join(' ')) : '') + '</div>' +
        '<div class="sub ' + (nGot === d.stops.length ? 'ok' : '') + '" style="margin-top:4px">인수증 ' + nGot + ' / ' + d.stops.length + (nGot === d.stops.length ? ' · 모두 올렸어요 👍' : '') + '</div>' +
        '<div class="card from"><div class="ttl">🏭 상차지 · ' + esc(p ? p.name : d.from) + '</div>' + (p ? (p.addr ? '<div class="row">' + esc(p.addr) + '</div>' : '') + (p.time ? '<div class="row muted">상차가능시간 ' + esc(p.time) + '</div>' : '') + (p.contact ? '<div class="row">' + tels(String(p.contact).split(/\n/)) + '</div>' : '') + (p.addr ? '<div class="btns">' + navLinks(p.name, p.addr) + '</div>' : '') : '') + '</div>' +
        d.stops.map(function (s, i) {
          var g = got(s.fc), items = Object.keys(s.items).map(function (k) { return esc(k) + ' <b>' + won(s.items[k]) + '</b>번들'; }).join(' · ');
          return '<div class="card"><div class="ttl"><span class="no">' + (i + 1) + '</span>' + esc(s.fc) + '</div>' +
            (s.addr ? '<div class="row">' + esc(s.addr) + '</div>' : '') + (s.hours ? '<div class="row muted">⏰ ' + esc(s.hours) + '</div>' : '') + (s.dock ? '<div class="row muted">📌 ' + esc(s.dock) + '</div>' : '') +
            '<div class="items">' + items + ' · 총 ' + won(s.bundle) + '번들' + (s.bl.length ? '<br><span class="muted">BL ' + esc(s.bl.join(', ')) + '</span>' : '') + '</div>' +
            (s.mgr.length ? '<div class="row">' + tels(s.mgr) + '</div>' : '') +
            '<div class="btns">' + navLinks(s.fc, s.addr, s.lat, s.lng) +
            '<label class="btn main' + (g.length ? ' done' : '') + '">' + (busy[s.fc] ? '<span class="spin"></span> 올리는 중…' : g.length ? '✅ 인수증 올림 (' + esc(String(g[g.length - 1].at).slice(11, 16)) + (g.length > 1 ? ' · ' + g.length + '장' : '') + ') · 다시 올리기' : '📷 싸인 받은 거래명세서 사진 올리기') +
            '<input type="file" accept="image/*" capture="environment" data-fc="' + esc(s.fc) + '"></label></div></div>';
        }).join('') +
        '<p class="note">이 페이지는 이 호차 기사님용이에요. 사진은 조일 사무실에서만 볼 수 있어요.</p>';
      Array.prototype.forEach.call(app.querySelectorAll('input[type=file]'), function (inp) { inp.onchange = function () { if (inp.files[0]) upload(inp.dataset.fc, inp.files[0]); inp.value = ''; }; });
    }
    function shrink(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요. 다시 찍어 주세요.')); };
        img.src = url;
      });
    }
    function upload(fc, file) {
      busy[fc] = 1; draw();
      shrink(file).then(function (b64) { return api('drv.upload', { fc: fc, data: b64 }); })
        .then(function (r) { data = r; delete busy[fc]; draw(); })
        .catch(function (e) { delete busy[fc]; draw(); alert('올리지 못했어요: ' + e.message + '\n다시 눌러 주세요.'); });
    }
    if (!T) { app.innerHTML = '<p class="err">링크가 잘못됐어요. 받은 문자의 링크를 다시 눌러 주세요.</p>'; return; }
    api('drv.get').then(function (r) { data = r; draw(); }).catch(function (e) { app.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  })();
  </script>
</body>
</html>
