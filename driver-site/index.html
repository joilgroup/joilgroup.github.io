<!doctype html>
<!-- 기사용 배차 안내 페이지 (별도 주소용 · drv.html과 같은 내용, 서버 주소만 들어 있음) -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>배차 안내</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --bg: #F3EEE5; --panel: #FFFFFF; --ink: #1E1C19; --muted: #7A7265; --line: #E2D9C9; --orange: #F07A22; --green: #2C7040; --red: #C2412B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; }
    .bar { height: 5px; background: linear-gradient(90deg, #E0472E 0 20%, #F07A22 20% 40%, #F4BE2E 40% 60%, #4FA864 60% 80%, #2A9DB0 80%); }
    h1 { font-size: 22px; margin: 6px 0 2px; }
    .sub { color: var(--muted); font-size: 14px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-top: 12px; }
    .card.from { background: #FFF8EE; }
    .card.notice { background: #FFF1E0; border-color: #F4C08A; }
    .card.notice div { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .card.notice div:first-child { margin-top: 0; }
    .no { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; margin-right: 8px; flex: none; }
    .ttl { display: flex; align-items: center; font-size: 19px; font-weight: 800; }
    .row { margin-top: 6px; font-size: 15px; }
    .muted { color: var(--muted); }
    .items { margin-top: 6px; background: #F7F3EC; border-radius: 10px; padding: 8px 10px; font-size: 15px; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; padding: 0 10px; }
    .btn.main { background: var(--ink); color: #fff; border-color: var(--ink); grid-column: 1 / -1; min-height: 56px; font-size: 17px; }
    .btn.done { background: #E7F3EA; color: var(--green); border-color: #BFDDC6; }
    .tel { display: inline-block; margin: 4px 8px 0 0; padding: 6px 10px; border-radius: 10px; background: #F1ECE3; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 15px; }
    .err { color: var(--red); font-weight: 700; }
    .ok { color: var(--green); font-weight: 700; }
    .note { font-size: 13px; color: var(--muted); margin-top: 16px; text-align: center; }
    .spin { display: inline-block; width: 18px; height: 18px; border: 3px solid #ddd; border-top-color: var(--ink); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -3px; }
    @keyframes s { to { transform: rotate(360deg); } }
    input[type=file] { display: none; }
    .phs { display: grid; gap: 10px; margin-top: 10px; }
    .ph { margin: 0; }
    .phi { min-height: 120px; border-radius: 12px; overflow: hidden; background: #F1ECE3; display: grid; place-items: center; color: var(--muted); font-size: 14px; }
    .phi img { width: 100%; display: block; cursor: zoom-in; }
    .ph figcaption { margin-top: 4px; font-size: 15px; font-weight: 700; }
    .zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 50; display: flex; align-items: center; justify-content: center; }
    .zoom img { max-width: 100%; max-height: 100%; }
    .zoom b { position: absolute; top: 12px; right: 16px; color: #fff; font-size: 30px; }
    #map { height: 240px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin-top: 12px; background: #EDE6DA; }
    .kpin { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; font: 800 15px/30px sans-serif; text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .kpin.from { background: var(--orange); }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="wrap" id="app"><p class="muted"><span class="spin"></span> 불러오는 중…</p></div>
  <script>
  (function () {
    'use strict';
    var API_URL = 'https://script.google.com/macros/s/AKfycbxIsfUYOD9xWmA2JAVXsV94-CKcOb1o3OfCCbCwO5ALkqFXjW_Zcy_seTwbPjK26ayj/exec';
    var T = String(location.hash || '').replace(/^#\/?/, '');
    var app = document.getElementById('app'), data = null, busy = {};
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function won(n) { return Number(n || 0).toLocaleString('ko-KR'); }
    function api(action, payload) {
      var req = Object.assign({ action: action, t: T }, payload || {});
      return fetch(API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + '_t=' + Date.now(), { method: 'POST', body: JSON.stringify(req), cache: 'no-store', credentials: 'omit', redirect: 'follow' })
        .then(function (r) { if (!r.ok) throw new Error('서버 연결 오류 (' + r.status + ')'); return r.json(); })
        .then(function (j) { if (!j.ok) throw new Error(j.error || '오류가 났어요.'); return j; });
    }
    function tels(list) { return (list || []).map(function (t) { var num = String(t).replace(/[^0-9]/g, ''); return num.length >= 8 ? '<a class="tel" href="tel:' + num + '">📞 ' + esc(t) + '</a>' : '<span class="tel">' + esc(t) + '</span>'; }).join(''); }
    function navLinks(name, addr, lat, lng) {
      var k = lat ? 'https://map.kakao.com/link/to/' + encodeURIComponent(name) + ',' + lat + ',' + lng : 'https://map.kakao.com/link/search/' + encodeURIComponent(addr || name);
      var t = lat ? 'tmap://route?goalname=' + encodeURIComponent(name) + '&goalx=' + lng + '&goaly=' + lat : 'tmap://search?name=' + encodeURIComponent(addr || name);
      return '<a class="btn" href="' + k + '" target="_blank" rel="noopener">🗺 카카오맵</a><a class="btn" href="' + t + '">🚗 티맵</a>';
    }
    var KAKAO_KEY = 'f70cb8ae1c6ad8cba10d83b8a9c6cf33';
    var mapNode = null;
    /** 지도: 상차지 → 착지 번호 핀, 하차 순서대로 직선 (핀을 누르면 그 착지로 이동) */
    function drawMap() {
      if (mapNode) return;
      var d = data, pts = [d.place && d.place.lat ? { lat: d.place.lat, lng: d.place.lng, label: '🏭', from: 1 } : null].concat(d.stops.map(function (s, i) { return s.lat ? { lat: s.lat, lng: s.lng, label: String(i + 1), i: i } : null; })).filter(Boolean);
      if (!KAKAO_KEY || !pts.length) return;
      mapNode = document.createElement('div'); mapNode.id = 'map';
      var place = function () { var slot = document.getElementById('mapSlot'); if (slot) slot.replaceWith(mapNode); };
      place();
      var sc = document.createElement('script');
      sc.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + encodeURIComponent(KAKAO_KEY) + '&autoload=false';
      sc.onerror = function () { mapNode.remove(); };
      sc.onload = function () {
        if (!(window.kakao && window.kakao.maps)) { mapNode.remove(); return; }
        window.kakao.maps.load(function () {
          var K = window.kakao.maps, map = new K.Map(mapNode, { center: new K.LatLng(pts[0].lat, pts[0].lng), level: 8 }), b = new K.LatLngBounds(), path = [];
          pts.forEach(function (p) {
            var pos = new K.LatLng(p.lat, p.lng), pin = document.createElement('div'); b.extend(pos); path.push(pos);
            pin.className = 'kpin' + (p.from ? ' from' : ''); pin.textContent = p.label;
            if (p.i != null) pin.onclick = function () { var c = document.getElementById('st' + p.i); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
            new K.CustomOverlay({ map: map, position: pos, content: pin, xAnchor: 0.5, yAnchor: 0.5 });
          });
          if (path.length > 1) { new K.Polyline({ map: map, path: path, strokeWeight: 4, strokeColor: '#1E1C19', strokeOpacity: 0.7 }); map.setBounds(b, 30, 30, 30, 30); } else map.setLevel(5);
          mapNode._map = map;
        });
      };
      document.head.appendChild(sc);
    }
    function draw() {
      var d = data, tb = 0, tk = 0;
      d.stops.forEach(function (s) { tb += s.bundle; tk += s.kg; });
      var got = function (fc) { return d.receipts.filter(function (r) { return r.fc === fc; }); };
      var nGot = d.stops.filter(function (s) { return got(s.fc).length; }).length;
      var p = d.place;
      app.innerHTML = '<div class="sub">' + esc(d.date) + ' · ' + esc(d.cust) + '</div><h1>' + d.no + '호차 · 착지 ' + d.stops.length + '곳</h1>' +
        '<div class="sub">총 ' + won(tb) + '번들 / ' + won(tk) + 'kg' + (d.car || d.driver ? ' · ' + esc([d.car, d.driver].filter(Boolean).join(' ')) : '') + '</div>' +
        '<div class="sub ' + (nGot === d.stops.length ? 'ok' : '') + '" style="margin-top:4px">인수증 ' + nGot + ' / ' + d.stops.length + (nGot === d.stops.length ? ' · 모두 올렸어요 👍' : '') + '</div>' +
        ((d.notes || []).length ? '<div class="card notice">' + d.notes.map(function (n) { return '<div>⚠️ ' + (d.stops.length > 1 && n.fc ? esc(n.fc) + ': ' : '') + esc(n.text) + '</div>'; }).join('') + '</div>' : '') +
        '<div id="mapSlot"></div><div class="card from"><div class="ttl">🏭 상차지 · ' + esc(p ? p.name : d.from) + '</div>' + (p ? (p.addr ? '<div class="row">' + esc(p.addr) + '</div>' : '') + (p.time ? '<div class="row muted">상차가능시간 ' + esc(p.time) + '</div>' : '') + (p.contact ? '<div class="row">' + tels(String(p.contact).split(/\n/)) + '</div>' : '') + (p.addr ? '<div class="btns">' + navLinks(p.name, p.addr) + '</div>' : '') +
          ((p.photos || []).length ? '<div class="phs">' + p.photos.map(function (ph) { return '<figure class="ph"><div class="phi" data-ph="' + esc(ph.id) + '">' + (photos[ph.id] ? '<img src="data:image/jpeg;base64,' + photos[ph.id] + '" alt="">' : '<span><span class="spin"></span> 사진 불러오는 중…</span>') + '</div>' + (ph.cap ? '<figcaption>📍 ' + esc(ph.cap) + '</figcaption>' : '') + '</figure>'; }).join('') + '</div>' : '') : '') + '</div>' +
        d.stops.map(function (s, i) {
          var g = got(s.fc), items = Object.keys(s.items).map(function (k) { return esc(k) + ' <b>' + won(s.items[k]) + '</b>번들'; }).join(' · ');
          return '<div class="card" id="st' + i + '"><div class="ttl"><span class="no">' + (i + 1) + '</span>' + esc(s.fc) + '</div>' +
            (s.addr ? '<div class="row">' + esc(s.addr) + '</div>' : '') + (s.hours ? '<div class="row muted">⏰ ' + esc(s.hours) + '</div>' : '') + (s.dock ? '<div class="row muted">📌 ' + esc(s.dock) + '</div>' : '') +
            '<div class="items">' + items + ' · 총 ' + won(s.bundle) + '번들' + (s.bl.length ? '<br><span class="muted">BL ' + esc(s.bl.join(', ')) + '</span>' : '') + '</div>' +
            (s.mgr.length ? '<div class="row">' + tels(s.mgr) + '</div>' : '') +
            '<div class="btns">' + navLinks(s.fc, s.addr, s.lat, s.lng) +
            '<label class="btn main' + (g.length ? ' done' : '') + '">' + (busy[s.fc] ? '<span class="spin"></span> 올리는 중…' : g.length ? '✅ 인수증 올림 (' + esc(String(g[g.length - 1].at).slice(11, 16)) + (g.length > 1 ? ' · ' + g.length + '장' : '') + ') · 다시 올리기' : '📷 싸인 받은 거래명세서 사진 올리기') +
            '<input type="file" accept="image/*" capture="environment" data-fc="' + esc(s.fc) + '"></label></div></div>';
        }).join('') +
        '<p class="note">이 페이지는 이 호차 기사님용이에요. 올린 사진은 배차 담당자만 볼 수 있어요.</p>';
      loadPhotos();
      if (mapNode) { var slot = document.getElementById('mapSlot'); if (slot) slot.replaceWith(mapNode); if (mapNode._map) mapNode._map.relayout(); } else drawMap();
      Array.prototype.forEach.call(app.querySelectorAll('input[type=file]'), function (inp) { inp.onchange = function () { if (inp.files[0]) upload(inp.dataset.fc, inp.files[0]); inp.value = ''; }; });
    }
    var photos = {};
    /** 상차지 사진: 한 번 받아 두고 다시 그릴 때 재사용 (누르면 크게) */
    function loadPhotos() {
      Array.prototype.forEach.call(app.querySelectorAll('[data-ph]'), function (box) {
        var id = box.dataset.ph, show = function () { box.innerHTML = '<img src="data:image/jpeg;base64,' + photos[id] + '" alt="">'; box.firstChild.onclick = function () { var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<b>✕</b><img src="data:image/jpeg;base64,' + photos[id] + '" alt="">'; z.onclick = function () { z.remove(); }; document.body.appendChild(z); }; };
        if (photos[id]) { show(); return; }
        if (photos[id] === null) return; photos[id] = null;
        api('drv.photo', { id: id }).then(function (r) { photos[id] = r.data; var b = app.querySelector('[data-ph="' + id + '"]'); if (b) { box = b; show(); } })
          .catch(function () { delete photos[id]; box.innerHTML = '<span>사진을 불러오지 못했어요</span>'; });
      });
    }
    function shrink(file) {
      return new Promise(function (resolve, reject) {
        var url = URL.createObjectURL(file), img = new Image();
        img.onload = function () {
          var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
        };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('사진을 읽지 못했어요. 다시 찍어 주세요.')); };
        img.src = url;
      });
    }
    function upload(fc, file) {
      busy[fc] = 1; draw();
      shrink(file).then(function (b64) { return api('drv.upload', { fc: fc, data: b64 }); })
        .then(function (r) { data = r; delete busy[fc]; draw(); })
        .catch(function (e) { delete busy[fc]; draw(); alert('올리지 못했어요: ' + e.message + '\n다시 눌러 주세요.'); });
    }
    if (!T) { app.innerHTML = '<p class="err">링크가 잘못됐어요. 받은 문자의 링크를 다시 눌러 주세요.</p>'; return; }
    api('drv.get').then(function (r) { data = r; draw(); }).catch(function (e) { app.innerHTML = '<p class="err">' + esc(e.message) + '</p>'; });
  })();
  </script>
</body>
</html>
