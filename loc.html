<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>위치 공유</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root { --bg: #F3EEE5; --panel: #FFFFFF; --ink: #1E1C19; --muted: #7A7265; --line: #E2D9C9; --orange: #F07A22; --green: #2C7040; --red: #C2412B; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
    .bar { height: 5px; background: linear-gradient(90deg, #E0472E 0 20%, #F07A22 20% 40%, #F4BE2E 40% 60%, #4FA864 60% 80%, #2A9DB0 80%); }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-size: 22px; margin: 6px 0 2px; }
    .sub { color: var(--muted); font-size: 15px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-top: 14px; }
    .card.warn { background: #FFF1E0; border-color: #F4C08A; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 58px; border-radius: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 12px; }
    .btn.main { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn.stop { background: #FCEBE7; color: var(--red); border-color: #F1C3B8; }
    .btn:disabled { opacity: .5; }
    .state { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: #A9A39A; flex: none; }
    .dot.on { background: #2F9E57; box-shadow: 0 0 0 0 rgba(47,158,87,.5); animation: pulse 1.8s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(47,158,87,0); } 100% { box-shadow: 0 0 0 0 rgba(47,158,87,0); } }
    .muted { color: var(--muted); }
    .small { font-size: 14px; }
    .err { color: var(--red); font-weight: 700; }
    ul { margin: 6px 0 0; padding-left: 20px; }
    li { margin: 3px 0; }
  </style>
</head>
<body>
<div class="bar"></div>
<div class="wrap" id="app"><p class="muted">불러오는 중…</p></div>
<script src="config.js"></script>
<script>
/* 용차 위치 공유 (앱 설치 없이): 링크를 열고 '위치 공유 시작' → 이 화면이 켜져 있는 동안 5분마다 위치 전송 → '종료' 또는 그날 밤 12시에 끝.
   브라우저는 화면이 꺼지거나 다른 앱(내비)으로 가면 위치를 못 받아요 → 화면 켜 두기(Wake Lock)·다시 돌아오면 바로 전송·못 보낸 점은 모아 두었다 보냄. */
(function () {
  var EVERY = 5 * 60000, cfg = window.JOIL_CONFIG || {}, base = String(cfg.TRACK_URL || '').replace(/\/+$/, '');
  var token = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
  var app = document.getElementById('app'), info = null, watch = null, timer = 0, lock = null, last = null, sentAt = 0, keptAt = 0, sending = false, battery = null, errMsg = '';
  var QK = 'loc-q-' + token, OK = 'loc-on-' + token;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var get = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var put = function (k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} };
  var hm = function (t) { var d = new Date(t); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); };
  var md = function (s) { var p = String(s).split('-'); return Number(p[1]) + '월 ' + Number(p[2]) + '일'; };
  var url = function (x) { return base + '/l/' + token + (x || ''); };
  function call(body) {
    // text/plain: 브라우저가 미리 묻는 요청(OPTIONS)을 안 보내게
    return fetch(url(), body ? { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) } : {}).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.status = r.status; return j; }); });
  }
  function head() { return '<h1>위치 공유</h1><div class="sub">' + (info ? esc(info.plate) + ' · ' + md(info.date) + ' 하루' : '') + '</div>'; }
  function draw(st) {
    if (st === 'bad') { app.innerHTML = '<h1>위치 공유</h1><div class="card"><p class="err" style="margin:0">링크가 맞지 않아요.</p><p class="muted small">문자로 받은 링크를 다시 눌러 주세요.</p></div>'; return; }
    if (st === 'ended' || st === 'expired') { app.innerHTML = head() + '<div class="card"><div class="state"><span class="dot"></span>' + (st === 'ended' ? '위치 공유를 마쳤어요' : '이 링크는 기간이 끝났어요') + '</div><p class="muted small" style="margin:8px 0 0">더 이상 위치를 보내지 않아요. 이 화면은 닫으셔도 돼요.</p></div>'; return; }
    if (st === 'early') { app.innerHTML = head() + '<div class="card"><p style="margin:0"><b>' + md(info.date) + '</b>에 쓰는 링크예요. 그날 다시 눌러 주세요.</p></div>'; return; }
    if (st === 'ready') {
      app.innerHTML = head() + '<div class="card"><p style="margin:0 0 6px"><b>배송하는 동안 이 차의 위치를 배차 담당자에게 보여 줘요.</b></p><ul class="small">' +
        '<li>5분마다 지금 위치만 보내요. 다른 정보는 보내지 않아요.</li><li>배송 확인에만 쓰고, <b>종료</b>를 누르거나 오늘 밤 12시가 되면 자동으로 멈춰요.</li><li>위치 권한을 물으면 <b>허용</b>을 눌러 주세요.</li></ul>' +
        '<button class="btn main" id="go">동의하고 위치 공유 시작</button></div>' +
        '<div class="card warn small"><b>이 화면을 켜 둬야 위치가 전송돼요.</b> 화면을 끄거나 내비·카톡으로 가면 잠시 멈추고, 이 화면으로 돌아오면 다시 보내요.</div>' + (errMsg ? '<div class="card err small">' + esc(errMsg) + '</div>' : '');
      document.getElementById('go').onclick = start; return;
    }
    app.innerHTML = head() + '<div class="card"><div class="state"><span class="dot' + (errMsg ? '' : ' on') + '"></span>' + (errMsg ? '위치를 못 받고 있어요' : '위치 공유 중') + '</div>' +
      '<p class="small" style="margin:8px 0 0">' + (sentAt ? '마지막 전송 <b>' + hm(sentAt) + '</b>' : keptAt ? '아직 전송 전' : '첫 위치를 찾는 중…') + (battery != null ? ' · 배터리 ' + battery + '%' : '') + (queue().length ? ' · 못 보낸 위치 ' + queue().length + '개(연결되면 보내요)' : '') + '</p>' +
      (errMsg ? '<p class="err small" style="margin:6px 0 0">' + esc(errMsg) + '</p>' : '') +
      '<button class="btn stop" id="stop">배송 끝 · 위치 공유 종료</button></div>' +
      '<div class="card warn small"><b>이 화면을 켜 두세요.</b> 화면이 켜져 있는 동안만 5분마다 보내요. 내비를 쓰다가도 가끔 이 화면으로 돌아오면 그동안 못 보낸 위치를 보내요. 충전기를 꽂아 두시면 좋아요.</div>';
    document.getElementById('stop').onclick = stop;
  }
  function queue() { try { return JSON.parse(get(QK) || '[]'); } catch (e) { return []; } }
  function flush() {
    var q = queue(); if (!q.length || sending) return;
    sending = true;
    call({ points: q.slice(-200) }).then(function (r) {
      sending = false;
      if (r.status === 410) { put(QK, null); return finish(r.state || 'expired'); }
      if (r.status === 200) { put(QK, null); sentAt = Date.now(); }
      draw('started');
    }).catch(function () { sending = false; draw('started'); });
  }
  function keep(p) {
    var c = p.coords, q = queue();
    q.push({ t: p.timestamp || Date.now(), lat: c.latitude, lng: c.longitude, accuracy: c.accuracy, speed: c.speed, heading: c.heading, battery: battery });
    put(QK, JSON.stringify(q.slice(-300))); keptAt = Date.now();
  }
  function tick(force) {
    if (!watch && watch !== 0) return;
    if (!force && Date.now() - keptAt < EVERY - 15000) return flush();
    // 방금(20초 안) 담은 게 있으면 또 담지 않음 (위치 지켜보기와 첫 전송이 같이 와서)
    var use = function (p) { errMsg = ''; last = p; if (Date.now() - keptAt > 20000) keep(p); flush(); };
    if (last && Date.now() - last.timestamp < 60000) return use(last);
    navigator.geolocation.getCurrentPosition(use, fail, { enableHighAccuracy: true, timeout: 30000, maximumAge: 30000 });
  }
  function fail(e) {
    errMsg = e && e.code === 1 ? '위치 권한이 꺼져 있어요. 주소창 왼쪽 자물쇠(또는 ⓘ) → 권한 → 위치 → 허용으로 바꾼 뒤 이 화면을 새로고침해 주세요.' : '위치를 찾지 못했어요. 폰 설정에서 위치(GPS)가 켜져 있는지 확인해 주세요.';
    draw(get(OK) ? 'started' : 'ready');
  }
  function wake() { if (navigator.wakeLock && document.visibilityState === 'visible' && !lock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }).catch(function () {}); }
  function start() {
    if (!navigator.geolocation) { errMsg = '이 브라우저는 위치를 지원하지 않아요. 크롬으로 열어 주세요.'; return draw('ready'); }
    put(OK, '1'); errMsg = '';
    watch = navigator.geolocation.watchPosition(function (p) { errMsg = ''; last = p; if (Date.now() - keptAt >= EVERY - 15000) { keep(p); flush(); } }, fail, { enableHighAccuracy: true, maximumAge: 30000, timeout: 60000 });
    clearInterval(timer); timer = setInterval(function () { tick(); }, 30000);
    wake(); draw('started'); tick(true);
  }
  function finish(st) {
    if (watch != null && navigator.geolocation) navigator.geolocation.clearWatch(watch);
    watch = null; clearInterval(timer); put(OK, null); put(QK, null); if (lock) lock.release().catch(function () {});
    draw(st);
  }
  function stop() {
    if (!confirm('위치 공유를 끝낼까요? 다시 켤 수 없어요.')) return;
    var b = document.getElementById('stop'); b.disabled = true; b.textContent = '끝내는 중…';
    tick(true);
    call({ end: true }).then(function () { finish('ended'); }).catch(function () { b.disabled = false; b.textContent = '배송 끝 · 위치 공유 종료'; alert('인터넷 연결을 확인하고 다시 눌러 주세요.'); });
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && watch != null) { wake(); tick(); } });
  if (navigator.getBattery) navigator.getBattery().then(function (b) { var f = function () { battery = Math.round(b.level * 100); }; f(); b.addEventListener('levelchange', f); }).catch(function () {});
  if (!/^[a-f0-9]{24,64}$/.test(token) || !base) return draw('bad');
  call().then(function (r) {
    if (r.status === 404 || !r.plate) return draw('bad');
    info = r;
    if (r.state === 'ended' || r.state === 'expired') { put(OK, null); put(QK, null); return draw(r.state); }
    if (r.today < r.date) return draw('early');
    // 전에 시작했던 링크를 다시 열면 바로 이어서 (권한은 이미 허용됨)
    if (get(OK) || r.state === 'started') start(); else draw('ready');
  }).catch(function () { app.innerHTML = '<h1>위치 공유</h1><div class="card"><p class="err" style="margin:0">인터넷 연결을 확인하고 새로고침해 주세요.</p></div>'; });
})();
</script>
</body>
</html>
